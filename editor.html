<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Menus - Interação Web</title>
    <link rel="icon" href="data:,">
    
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variaveis.css">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="js/components.js" defer></script>
</head>
<body>
    <my-header>
        <span slot="titulo">Editor de Menus (T1)</span>
    </my-header>

    <my-nav></my-nav>

    <main class="container-editor">
        <section class="formulario-edicao">
            <h2>Configurações do Menu</h2>
            <form id="form-menu" onsubmit="event.preventDefault()">
                <div class="grupo-input">
                    <label for="cor-fundo">Cor de Fundo do Menu:</label>
                    <input type="color" id="cor-fundo" value="#1a1a1a">
                </div>
                
                <div class="grupo-input">
                    <label for="cor-texto">Cor do Texto dos Itens:</label>
                    <input type="color" id="cor-texto" value="#e0e0e0">
                </div>

                <div class="grupo-input">
                    <label for="espacamento">Espaçamento dos Itens (px):</label>
                    <input type="number" id="espacamento" value="15" min="5" max="50">
                </div>

                <div class="grupo-input">
                    <label for="url-imagem">URL de uma Imagem para o Menu:</label>
                    <input type="url" id="url-imagem" placeholder="https://exemplo.com/imagem.png">
                </div>

                <div class="controles-itens">
                    <h3>Gerenciar Itens</h3>
                    <div class="grupo-input">
                        <label for="novo-item">Nome do Novo Item:</label>
                        <input type="text" id="novo-item" placeholder="Ex: Contato">
                    </div>
                    <button type="button" id="btn-adicionar">Adicionar Item</button>
                    <button type="button" id="btn-remover">Remover Último Item</button>
                </div>
            </form>
        </section>

        <section class="visualizacao-menu">
            <h2>Visualização em Tempo Real</h2>
            <div id="area-menu-gerado">
                <img id="imagem-menu" src="[https://via.placeholder.com/1](https://via.placeholder.com/1)" alt="Imagem do menu" style="display: none; max-width: 100px; margin-bottom: 15px;">
                <nav id="menu-dinamico">
                    <ul id="lista-dinamica">
                        <li><a href="#">Item 1</a></li>
                        <li><a href="#">Item 2</a></li>
                    </ul>
                </nav>
            </div>
        </section>
    </main>

    <my-footer></my-footer>

    <script src="js/editor.js"></script>
</body>
</html>
